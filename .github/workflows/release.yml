name: Release

# Tag-triggered packaging: builds the plugin, packs the npm tarball, and attaches
# it to the GitHub release as the stable name `dsh-rtk-latest.tgz`. The README's
# tarball install URL points at
# `releases/latest/download/dsh-rtk-latest.tgz`, so without this job that path
# 404s even when the npm package is perfectly installable.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: dsh-rtk

      # Same sibling checkout as ci.yml: the plugin's devDependencies use `link:`
      # into a local deepseek-harness tree, so it must exist before `pnpm install`.
      - name: Checkout deepseek-harness (sibling)
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.19'
          cache: pnpm
          cache-dependency-path: dsh-rtk/pnpm-lock.yaml

      - name: Install harness deps
        working-directory: deepseek-harness
        run: pnpm install

      - name: Build harness host libs
        working-directory: deepseek-harness
        run: pnpm build:lib:host

      - name: Install plugin deps
        working-directory: dsh-rtk
        run: pnpm install --ignore-scripts

      # Emits ./dsh-rtk-latest.tgz (npm rewrites the file name from the package
      # name, so we rename afterwards). `--ignore-scripts` keeps `prepack` off;
      # the build is invoked explicitly right before so nothing is stale.
      - name: Build and pack
        working-directory: dsh-rtk
        run: |
          set -euo pipefail
          pnpm run build
          npm pack --ignore-scripts
          mv ./*.tgz dsh-rtk-latest.tgz
          tar -tzf dsh-rtk-latest.tgz | head -20

      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dsh-rtk/dsh-rtk-latest.tgz --clobber
